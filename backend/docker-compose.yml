services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://brightloop:brightloop@db:5432/brightloop
      SECRET_KEY: change-me-to-a-long-random-string-before-any-real-use
      ADMIN_EMAIL: admin@brightloop.com
      ADMIN_PASSWORD: Admin@12345
    ports:
      - "8000:8000"

volumes:
  pgdata:
